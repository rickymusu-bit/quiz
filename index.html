<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hellscape - Fuggi dall’inferno. Il quiz di fisica per la classe.">
<meta name="theme-color" content="#090809">
<title>Hellscape - Fuggi dall’inferno</title>


<link rel="stylesheet" href="assets/hellscape.css">
<link rel="stylesheet" href="assets/home.css"></head>
<body>
<div id="viewport-stage"><main class="home-screen">
<img class="home-illustration" src="assets/hellscape-chase.webp" width="1448" height="1086" fetchpriority="high" alt="Il demone insegue un convoglio di sei veicoli tra lava e rovine: chopper, pick-up, camion, coupé, fuoristrada e Ape.">
<div class="home-content">
<p class="subtitle">fuggi dall'inferno</p>
<h1><img class="home-wordmark" src="assets/hellscape-logo.webp" width="2172" height="724" fetchpriority="high" alt="HELLSCAPE"></h1>
<nav class="menu" aria-label="Menu principale">
<a class="home-primary" href="Fool.html?start=1" aria-keyshortcuts="N">Nuova partita</a>
<a class="home-primary" id="resume-game" href="Fool.html?resume=1" aria-keyshortcuts="R" hidden>Riprendi partita</a>
<a href="Fool_regole.html" aria-keyshortcuts="G">Regole</a>
<a href="Fool.html?settings=1" aria-keyshortcuts="I">Impostazioni</a>
<button id="home-fullscreen" type="button" aria-keyshortcuts="F">Schermo intero</button>
<p id="fullscreen-status" role="status" hidden></p>
</nav>
<p class="home-keys">N Nuova · R Riprendi · G Regole · I Impostazioni · F Schermo intero</p>
</div>
</main></div>
<script>
const fullscreenButton=document.getElementById('home-fullscreen'),fullscreenStatus=document.getElementById('fullscreen-status');
function updateResumeLink(){
 let available=false;
 try{const saved=JSON.parse(localStorage.getItem('fool-v1'));available=!!saved&&['ordinaria','pareggio'].includes(saved.phase)&&Array.isArray(saved.groups)&&saved.groups.length===3}catch(error){}
 document.getElementById('resume-game').hidden=!available;
 window.fitFoolViewport?.();
}
updateResumeLink();
document.addEventListener('keydown',event=>{
 if(event.defaultPrevented||event.repeat||event.isComposing||event.ctrlKey||event.altKey||event.metaKey||document.getElementById('play-frame')||event.target.closest?.('input,select,textarea,[contenteditable="true"]'))return;
 const keys={n:'.menu a[href="Fool.html?start=1"]',r:'#resume-game',g:'.menu a[href="Fool_regole.html"]',i:'.menu a[href="Fool.html?settings=1"]',f:'#home-fullscreen'},selector=keys[event.key.toLowerCase()],control=selector&&document.querySelector(selector);
 if(control&&!control.hidden){event.preventDefault();control.click()}
});
window.addEventListener('pageshow',updateResumeLink);
window.addEventListener('storage',updateResumeLink);
window.foolToggleFullscreen=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else throw Error('Lo schermo intero non è disponibile in questo browser.')}catch(error){fullscreenStatus.textContent='Il browser non consente lo schermo intero. Puoi continuare in questa finestra.';fullscreenStatus.hidden=false}};
fullscreenButton.onclick=window.foolToggleFullscreen;
document.addEventListener('fullscreenchange',()=>{fullscreenButton.textContent=document.fullscreenElement?'Esci da schermo intero':'Schermo intero'});
window.foolReturnHome=()=>{document.getElementById('play-frame')?.remove();document.getElementById('viewport-stage').hidden=false;updateResumeLink()};
for(const link of document.querySelectorAll('.menu a'))link.addEventListener('click',event=>{if(!document.fullscreenElement)return;event.preventDefault();const frame=document.createElement('iframe');frame.id='play-frame';frame.title=link.textContent==='Regole'?'Regole di Hellscape':'Hellscape';frame.allow='fullscreen';frame.src=link.href;document.getElementById('viewport-stage').hidden=true;document.body.append(frame)});
try{if(window.parent!==window&&window.parent.location.origin===location.origin&&window.parent.foolReturnHome)window.parent.foolReturnHome()}catch(error){}
</script>
<script>
window.fitFoolViewport=()=>{const v=window.visualViewport,scale=Math.min((v?.width||innerWidth)/1024,(v?.height||innerHeight)/768);document.getElementById('viewport-stage').style.transform='translate(-50%,-50%) scale('+scale+')'};
window.addEventListener('resize',fitFoolViewport);window.visualViewport?.addEventListener('resize',fitFoolViewport);document.addEventListener('fullscreenchange',fitFoolViewport);fitFoolViewport();
</script></body></html>
