<h1>Hellscape · Ossa, ferro e fuoco</h1><p>Il ponte sulla lava e le nove Omen. Premi un nome per vedere l’animazione.</p>
<div class="preview-stage" id="stage"></div>
<div class="controls" id="ammo-buttons" aria-label="Animazioni Omen"></div>
<div class="controls"><button id="play-all">Riproduci tutte</button><button id="bridge-only">Guarda il ponte</button><label>Veicoli <select id="vehicles"><option value="standard">Chopper, pick-up, Ape</option><option value="large">Pick-up, camion, fuoristrada</option></select></label></div>
<p id="effect-description" role="status">Nessuna munizione attiva. I tre veicoli viaggiano affiancati sul ponte.</p>
<small>Anteprima dimostrativa: non legge né modifica le partite salvate. Rispetta la preferenza di movimento ridotto.</small>
