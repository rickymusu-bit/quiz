name: Verifica sito e anteprima Hellscape
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hellscape-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - suite: core
            command: npm test && npm run test:frames && npm run build
          - suite: portal
            command: npm run test:portal
          - suite: chase
            command: npm run test:chase
          - suite: ties
            command: npm run test:ties
          - suite: motion
            command: npm run test:motion
          - suite: layout
            command: npm run test:layout
          - suite: browser
            command: npm run test:browser
          - suite: ammo
            command: npm run test:ammo
          - suite: endings
            command: npm run test:endings
          - suite: terrain
            command: npm run test:terrain
          - suite: offline
            command: npm run test:offline
          - suite: quality
            command: npm run test:quality
          - suite: orientation
            command: npm run preview:offline && npm run test:orientation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r requirements-test.txt
      - name: Riutilizza Chromium disponibile, altrimenti installa il browser di test
        shell: bash
        run: |
          browser_path=$(command -v chromium || command -v chromium-browser || true)
          if [ -z "$browser_path" ]; then
            npx playwright install --with-deps chromium
            browser_path=$(node -p "require('playwright').chromium.executablePath()")
          fi
          echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Esegui ${{ matrix.suite }}
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hellscape-${{ github.sha }}-${{ matrix.suite }}
          if-no-files-found: ignore
          path: |
            dist/Hellscape-offline.html
            dist/Hellscape-Ammo.html
            dist/Hellscape-review.html
            dist/revision.json
            artifacts/*.png
            artifacts/quality/
            artifacts/layout/
            artifacts/motion/
            artifacts/tie/
            artifacts/chase/
            artifacts/portal/
            artifacts/orientation/
  verify:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Tutte le suite devono riuscire
        run: test "${{ needs.checks.result }}" = "success"
