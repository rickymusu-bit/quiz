name: Verifica sito e anteprima Hellscape
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 -m pip install -r requirements-test.txt
      - name: Riutilizza Chromium disponibile, altrimenti installa il browser di test
        shell: bash
        run: |
          browser_path=$(command -v chromium || command -v chromium-browser || true)
          if [ -z "$browser_path" ]; then
            npx playwright install --with-deps chromium
            browser_path=$(node -p "require('playwright').chromium.executablePath()")
          fi
          echo "CHROMIUM_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run test:frames
      - run: npm run test:browser
      - run: npm run test:endings
      - run: npm run test:terrain
      - run: npm run build
      - run: npm run test:offline
      - uses: actions/upload-artifact@v4
        with:
          name: hellscape-${{ github.sha }}
          path: |
            dist/Hellscape-offline.html
            dist/revision.json
            artifacts/*.png
