name: Pulizia sicura dei branch Hellscape

on:
  pull_request:
    paths:
      - '.github/workflows/branch-prune.yml'
      - 'docs/BRANCH_AUDIT_v1.0.0_20261030.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: hellscape-branch-pruning
  cancel-in-progress: false

jobs:
  audit-and-prune:
    name: Verifica PR e rimuovi solo i branch integrati
    runs-on: ubuntu-latest
    steps:
      - name: Audit completo dei riferimenti e pulizia protetta
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const dryRun = context.eventName === 'pull_request';
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            const closed = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', per_page: 100
            });
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mergedHeads = new Map();
            for (const pr of closed) {
              if (!pr.merged_at || pr.head.repo?.full_name !== repository) continue;
              const entries = mergedHeads.get(pr.head.ref) || [];
              entries.push({ number: pr.number, sha: pr.head.sha });
              mergedHeads.set(pr.head.ref, entries);
            }
            const activeHeads = new Set(open
              .filter(pr => pr.head.repo?.full_name === repository)
              .map(pr => pr.head.ref));
            // Historical review-only branches are eligible only after every
            // unique source blob has been copied byte-for-byte to main.
            const reviewedEvidence = new Map([
              ['review/chase-acbc154', { sha: '107d49d81dd474412d7507f95e2c2d47436735c3', folder: 'chase-acbc154' }],
              ['review/hellscape-6644b51', { sha: 'b55224d746cc60c5994f876d6abb7c23dab2e7cf', folder: 'hellscape-6644b51' }],
              ['review/layout-db61c4e', { sha: '9d3e771429506e0b05a353103457bd65e09ccf39', folder: 'layout-db61c4e' }],
              ['review/motion-1811784', { sha: 'c8bd2e5c62e52fa6a85f205fe2894626cc01a2cb', folder: 'motion-1811784' }],
              ['review/portal-a29e820', { sha: '64122d744579a8e2569b232b91bba0d97b58894a', folder: 'portal-a29e820' }],
              ['review/tie-6a7a75b', { sha: '766bf68e4f2627d66285bc9122460ba18777d7ee', folder: 'tie-6a7a75b' }],
              ['review/tie-a23546f', { sha: '29272c3a0785495e45077f9d11da81f5f64b271a', folder: 'tie-a23546f' }]
            ]);
            const mainTree = await github.rest.git.getTree({
              owner, repo, tree_sha: main.data.commit.sha, recursive: 'true'
            });
            if (mainTree.data.truncated) throw Error('Main tree truncated: refuse pruning');
            const mainBlobs = new Map(mainTree.data.tree
              .filter(item => item.type === 'blob')
              .map(item => [item.path, item.sha]));
            const candidates = [];
            const retained = [];
            for (const branch of branches) {
              const name = branch.name;
              if (name === 'main' || branch.protected || activeHeads.has(name)) {
                retained.push({ name, reason: 'main, protected or open PR' });
                continue;
              }
              const found = (mergedHeads.get(name) || [])
                .find(pr => pr.sha === branch.commit.sha);
              if (found) {
                candidates.push({ name, sha: branch.commit.sha,
                  reason: `merged PR #${found.number} with exact head SHA` });
                continue;
              }
              // Only this previously audited historical branch is eligible
              // without a merged PR. Never delete unknown unmerged work.
              if (name === 'design/black-stone-bridge'
                  && branch.commit.sha === '7c831bfa71f031e8be951e775ea1f9d43ca9ca46') {
                const comparison = await github.rest.repos.compareCommits({
                  owner, repo, base: main.data.commit.sha, head: name
                });
                if (comparison.data.ahead_by === 0) {
                  candidates.push({ name, sha: branch.commit.sha,
                    reason: 'previously audited fully-contained historical commit' });
                  continue;
                }
              }
              const archive = reviewedEvidence.get(name);
              if (archive && archive.sha === branch.commit.sha) {
                const tree = await github.rest.git.getTree({
                  owner, repo, tree_sha: branch.commit.sha, recursive: 'true'
                });
                if (tree.data.truncated) throw Error('Review tree truncated: ' + name);
                const sourceFiles = tree.data.tree.filter(item =>
                  item.type === 'blob' && item.path.startsWith('review/'));
                const comparison = await github.rest.repos.compareCommits({
                  owner, repo, base: main.data.commit.sha, head: branch.commit.sha
                });
                const reviewOnly = comparison.data.ahead_by === 1
                  && comparison.data.files.length === sourceFiles.length
                  && comparison.data.files.every(file =>
                    file.status === 'added' && file.filename.startsWith('review/'));
                const complete = sourceFiles.length > 0 && sourceFiles.every(file =>
                  mainBlobs.get('docs/review-archive/20261030/' + archive.folder + '/' + file.path.slice('review/'.length)) === file.sha);
                if (reviewOnly && complete) {
                  candidates.push({ name, sha: branch.commit.sha,
                    reason: 'all unmerged review evidence archived with identical blob SHAs' });
                  continue;
                }
                retained.push({ name, reason: 'review evidence not completely archived or unexpected diff' });
                continue;
              }
              retained.push({ name, reason: 'nonmerged or independent evidence' });
            }
            core.info(`Found ${branches.length} branches; eligible ${candidates.length}; retained ${retained.length}; dry-run=${dryRun}`);
            core.summary.addHeading('Hellscape: verifica e pulizia branch');
            core.summary.addRaw(`Modalità: ${dryRun ? 'simulazione PR' : 'eliminazione su main'}\n\n`);
            core.summary.addRaw(`Branch trovati: ${branches.length}; idonei: ${candidates.length}; preservati: ${retained.length}\n\n`);
            core.summary.addTable([
              [{data:'Branch',header:true},{data:'Decisione',header:true},{data:'Motivo',header:true}],
              ...retained.map(x => [x.name, 'preservato', x.reason])
            ]);
            if (!dryRun) {
              let deleted = 0;
              for (const item of candidates) {
                // Recheck SHA immediately before mutation, preserving moving
                // branches and work started after the audit.
                const ref = `heads/${item.name}`;
                let current;
                try {
                  current = await github.rest.git.getRef({ owner, repo, ref });
                } catch (error) {
                  if (error.status === 404) {
                    core.info(`Already deleted: ${item.name}`);
                    continue;
                  }
                  throw error;
                }
                if (current.data.object.sha !== item.sha) {
                  core.warning(`Branch changed; skipping: ${item.name}`);
                  continue;
                }
                await github.rest.git.deleteRef({ owner, repo, ref });
                deleted++;
                core.info(`Deleted ${item.name}: ${item.reason}`);
              }
              core.summary.addRaw(`\nEliminati effettivamente: ${deleted}\n`);
            } else {
              core.info('Dry-run: no branch references were deleted.');
            }
            await core.summary.write();
