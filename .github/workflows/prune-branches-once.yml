name: Elimina branch superflui (una tantum)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prune-branches-once.yml']
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Elimina solo i sette branch verificati
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS='|' read -r branch expected_sha; do
            if [[ "$branch" == "main" || -z "$branch" ]]; then echo "Branch non consentito"; exit 1; fi
            actual=$(gh api "repos/${GH_REPO}/branches/${branch}" --jq ".commit.sha") || { echo "Impossibile leggere ${branch}"; failed=1; continue; }
            if [[ "$actual" != "$expected_sha" ]]; then echo "Branch modificato: ${branch} (preservato)"; failed=1; continue; fi
            if gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${branch}" >/dev/null; then echo "ELIMINATO: ${branch}"; else echo "ERRORE: ${branch}"; failed=1; fi
          done <<'BRANCHES'
          codex/fool-offline-18-0-1|1183b611230b6946b001666b52183cd3143acf51
          docs/fool-prompt-domande-adattato-20261025|043cf5fbd0d2508cd6b271d3ea93584ec06ea989
          feat/rigenera-banche-fool-20261025|363fc4227422fc08e5b3dab88e0ee01e44df6f82
          feature/fool-configurable-question-count|fb98c81e9af71195b04e2677cf5f16a9a58dd8e0
          fix/fool-bonus-hold-score|b027cc7e8cde9055c7534bcbeb6f3e8c176ef59a
          gh-pages|38e38e72c88b647f314d38d091f07c3b00a4c973
          main-legacy-backup|a9ffc042927e2550b37511421bd8de00c2baab44
          BRANCHES
          exit "$failed"
